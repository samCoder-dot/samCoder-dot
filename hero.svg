<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Floating blurred blobs (glass "light source" behind the panel) -->
  <circle cx="180" cy="60" r="140" fill="url(#blob1)" filter="url(#blur1)">
    <animate attributeName="cx" values="180;230;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="260" r="160" fill="url(#blob2)" filter="url(#blur1)">
    <animate attributeName="cy" values="260;210;260" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="40" r="120" fill="url(#blob3)" filter="url(#blur1)">
    <animate attributeName="cx" values="950;900;950" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass panel -->
  <rect x="60" y="55" width="1080" height="210" rx="28" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="60" y="55" width="1080" height="210" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Avatar circle -->
  <circle cx="175" cy="160" r="62" fill="url(#avatarRing)"/>
  <circle cx="175" cy="160" r="54" fill="#1a1730"/>
  <text x="175" y="176" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">SA</text>

  <!-- Name & tagline -->
  <text x="270" y="140" font-family="Segoe UI, Verdana, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Samran Arshad</text>
  <text x="270" y="172" font-family="Segoe UI, Verdana, sans-serif" font-size="17" fill="#c9c6e8">Full-Stack Web Developer &#183; ASP.NET MVC &#183; Python Automation</text>

  <!-- Badge pills -->
  <rect x="270" y="195" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="329" y="215" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">ASP.NET MVC</text>

  <rect x="398" y="195" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="443" y="215" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">C#</text>

  <rect x="498" y="195" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="563" y="215" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">SQL Server</text>

  <rect x="638" y="195" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="683" y="215" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Python</text>

  <text x="270" y="248" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#a9a5cf">4.8★ Freelancer &#8226; Built Mualim-UL-Quran, used in 300+ universities</text>
</svg>
